name: Generate Lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gen-lockfile.yml"

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Verify lockfile
        run: |
          test -f package-lock.json || (echo "❌ lockfile not created" && exit 1)
          echo "📦 Size: $(wc -c < package-lock.json) bytes"
          echo "📋 Lines: $(wc -l < package-lock.json)"
          node -e "const p=require('./package-lock.json'); console.log('lockfileVersion:', p.lockfileVersion); console.log('name:', p.name); console.log('deps:', Object.keys(p.packages||{}).length)"

      - name: Verify reproducibility
        run: |
          rm -rf node_modules
          npm ci
          node -e "const pkg=require('./package.json'); const lock=require('./package-lock.json'); const spec=pkg.dependencies.next; const locked=lock.packages['node_modules/next']?.version; console.log('next in pkg:', spec, '→ locked:', locked); if(!locked) process.exit(1);"

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --staged --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "chore: add package-lock.json for reproducible builds"
            git push
          fi
